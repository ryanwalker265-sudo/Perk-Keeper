name: PerkKeeper
options:
  bundleIdPrefix: com.perkkeeper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PerkKeeper:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: PerkKeeperWidget
        embed: true
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Perk Keeper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.perkkeeper.app.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.perkkeeper.app
            CFBundleURLSchemes:
              - perkkeeper
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlock Perk Keeper with Face ID.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: Support/PerkKeeper.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.perkkeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perkkeeper.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme: {}
  PerkKeeperWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: Perk Keeper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/PerkKeeperWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.perkkeeper.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perkkeeper.app.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic
