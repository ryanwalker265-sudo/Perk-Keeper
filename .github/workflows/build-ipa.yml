name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    name: Offer engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: Tests/engine
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Run engine tests (Chromium + WebKit)
        working-directory: Tests/engine
        run: node run.mjs all

  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PerkKeeper.xcodeproj \
            -scheme PerkKeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|will never)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" -A3 build.log | head -80; exit 1; }

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/PerkKeeper.app
          # Ad-hoc signature that carries the App Group entitlement, so sideloading tools
          # that keep entitlements (AltStore, SideStore) can give the widget its data.
          codesign --force --sign - --timestamp=none --entitlements Support/PerkKeeperWidget.entitlements "$APP/PlugIns/PerkKeeperWidget.appex" || true
          codesign --force --sign - --timestamp=none --entitlements Support/PerkKeeper.entitlements "$APP" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PerkKeeper-unsigned.ipa Payload
          ls -la PerkKeeper-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PerkKeeper-unsigned-ipa
          path: PerkKeeper-unsigned.ipa

      - name: Publish release with direct IPA download
        if: github.ref == 'refs/heads/main'
        run: |
          VER=$(grep CFBundleShortVersionString project.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
          cp PerkKeeper-unsigned.ipa PerkKeeper.ipa
          gh release create "v${VER}-build${{ github.run_number }}" PerkKeeper.ipa \
            --title "Perk Keeper ${VER} (build ${{ github.run_number }})" \
            --notes "Unsigned IPA. Sign and install it with your sideloading tool." --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"

      - name: Generate project and build for the simulator
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project PerkKeeper.xcodeproj -scheme PerkKeeper -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Take screenshots
        run: bash Tests/screenshots.sh simbuild/Build/Products/Debug-iphonesimulator/PerkKeeper.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
